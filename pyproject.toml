[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydrlpdid"
version = "0.7.2"
description = "Doubly Robust Local Projections Difference-in-Differences for Python."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  {name = "Daniel de Abreu Pereira Uhr"},
  {name = "Guilherme Valle Moura"},
]
keywords = [
  "difference-in-differences",
  "local-projections",
  "doubly-robust",
  "causal-inference",
  "event-study",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.21",
  "pandas>=1.3",
  "scipy>=1.7",
  "statsmodels>=0.13",
  "patsy>=0.5",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.4"]
test = ["pytest>=7.0"]
dev = ["pytest>=7.0", "matplotlib>=3.4", "build>=1.0"]

[project.urls]
Homepage = "https://github.com/Daniel-Uhr/pydrlpdid"
Repository = "https://github.com/Daniel-Uhr/pydrlpdid"
Issues = "https://github.com/Daniel-Uhr/pydrlpdid/issues"

[tool.setuptools.packages.find]
where = ["src"]
